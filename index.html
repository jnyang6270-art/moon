<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#060a14">
  <title>三分 — 你的解籤日記</title>

  <!-- Google Fonts for High-End Chinese Display Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">

  <!-- Three.js + GLTFLoader (ES Modules) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 320vh;
      background: #060a14;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* Fixed, pinned viewport */
    .viewport {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #060a14;
    }

    /* Background image with accurate scroll-driven parallax */
    .bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .bg img {
      position: absolute;
      top: 0;
      left: 50%;
      width: 105vw;
      height: auto;
      min-height: 140vh;
      transform: translate3d(-50%, 0, 0);
      object-fit: cover;
      will-change: transform;
    }

    @media (max-width: 1060px) and (max-aspect-ratio: 49/64) {
      .bg img {
        height: 145dvh;
        width: auto;
        min-width: 105vw;
        object-fit: cover;
      }
    }

    .bg-scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(3, 6, 14, 0.45) 0%, rgba(3, 6, 14, 0.05) 35%, rgba(3, 6, 14, 0.1) 70%, rgba(3, 6, 14, 0.35) 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* Brand Text: 天時。地利。人和 (Top Left) */
    .brand-mark {
      position: fixed;
      top: 32px;
      left: 36px;
      font-family: 'Noto Serif TC', 'Songti TC', 'STSong', serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.35em;
      color: rgba(255, 255, 255, 0.92);
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 255, 255, 0.2);
      z-index: 10;
      pointer-events: none;
      user-select: none;
    }

    /* 3D Moon Canvas */
    #moon-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* Scene Titles Container */
    .title-layer {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    /* 1. Super Big Hero Title: "三" (Left) and "分" (Right) flanking the Moon */
    .hero-title-wrap {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate3d(-50%, -50%, 0);
      width: 92vw;
      max-width: 1600px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .hero-char {
      display: inline-block;
      font-family: 'Noto Serif TC', 'Songti TC', 'STSong', serif;
      font-weight: 900;
      font-size: clamp(140px, 22vw, 380px);
      line-height: 0.9;
      color: #ffffff;
      text-shadow: 0 20px 70px rgba(0, 0, 0, 0.8), 0 4px 16px rgba(0, 0, 0, 0.6);
      user-select: none;
      will-change: transform, opacity;
    }

    /* 2. Secondary Big Title: "你的解籤日記" (Flush to bottom) */
    .section2-title-wrap {
      position: absolute;
      bottom: -15px;
      left: 50%;
      transform: translate3d(-50%, 0, 0);
      width: 100vw;
      text-align: center;
      pointer-events: none;
      z-index: 4;
    }

    .diff-title {
      font-family: 'Noto Serif TC', 'Songti TC', 'STSong', serif;
      font-weight: 900;
      font-size: clamp(80px, 14vw, 220px);
      letter-spacing: 0.12em;
      text-indent: 0.12em;
      line-height: 0.9;
      color: #ffffff;
      text-shadow: 0 20px 60px rgba(0, 0, 0, 0.85), 0 4px 20px rgba(0, 0, 0, 0.6);
      user-select: none;
      white-space: nowrap;
    }

    .diff-char {
      display: inline-block;
      will-change: transform, opacity;
    }

    /* Callouts Layer around Moon in Scene 2 */
    .callouts-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
    }

    .callout-item {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 12px;
      opacity: 0;
      will-change: transform, opacity;
    }

    .callout-label {
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 16px;
      padding: 12px 20px;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      white-space: nowrap;
    }

    .callout-tile {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
      flex-shrink: 0;
    }

    /* Placements relative to center of screen */
    .callout-0 {
      right: calc(50% + 220px);
      top: calc(50% - 150px);
    }
    .callout-1 {
      left: calc(50% + 220px);
      top: calc(50% - 150px);
    }
    .callout-2 {
      right: calc(50% + 220px);
      top: calc(50% + 60px);
    }
    .callout-3 {
      left: calc(50% + 220px);
      top: calc(50% + 60px);
    }

    /* Loading HUD */
    #loading-hud {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 50;
      color: #fff;
      font-family: 'Noto Serif TC', sans-serif;
      font-size: 14px;
      letter-spacing: 0.1em;
      background: rgba(6, 10, 20, 0.8);
      padding: 14px 28px;
      border-radius: 30px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: none;
      transition: opacity 0.5s ease;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }

    #loading-hud svg { animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    @media (max-width: 768px) {
      .brand-mark {
        top: 24px;
        left: 20px;
        font-size: 13px;
        letter-spacing: 0.25em;
      }
      .hero-title-wrap {
        width: 95vw;
      }
      .hero-char {
        font-size: clamp(90px, 25vw, 180px);
      }
      .diff-title {
        font-size: clamp(38px, 10vw, 76px);
        letter-spacing: 0.1em;
        text-indent: 0.1em;
      }
    }
  </style>
</head>
<body>

  <div class=viewport>
    <!-- 1. Background scene & Parallax -->
    <div class=bg>
      <img id="bg-img" src="https://cdn.jsdelivr.net/gh/jnyang6270-art/moon@main/background.jpg" alt="Starry sky over the sea at dusk">
    </div>
    <div class=bg-scrim></div>

    <!-- 2. Top-Left Brand Text -->
    <div class="brand-mark">天時。地利。人和</div>

    <!-- 3. Three.js 3D Moon Canvas -->
    <canvas id="moon-canvas"></canvas>

    <!-- 4. Typography Layer -->
    <div class="title-layer">
      <!-- Super Big Title: "三" on left, "分" on right of the moon -->
      <div class="hero-title-wrap" id="hero-wrap">
        <span class="hero-char char-left" id="char-san">三</span>
        <span class="hero-char char-right" id="char-fen">分</span>
      </div>

      <!-- Secondary Big Title: "你的解籤日記" flush to bottom -->
      <div class="section2-title-wrap" id="diff-wrap">
        <h2 class="diff-title" id="diff-title">你的解籤日記</h2>
      </div>

      <!-- Callouts Layer around Moon in Scene 2 -->
      <div class="callouts-layer" id="callouts-layer">
        <!-- Callout 0: Top-Left -->
        <div class="callout-item callout-0">
          <div class="callout-label">70% Single-Origin Dark</div>
          <div class="callout-tile">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2"></rect>
              <line x1="3" y1="9" x2="21" y2="9"></line>
              <line x1="3" y1="15" x2="21" y2="15"></line>
              <line x1="9" y1="3" x2="9" y2="21"></line>
              <line x1="15" y1="3" x2="15" y2="21"></line>
            </svg>
          </div>
        </div>

        <!-- Callout 1: Top-Right -->
        <div class="callout-item callout-1">
          <div class="callout-tile">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path>
              <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path>
            </svg>
          </div>
          <div class="callout-label">Organic Grass-fed Butter</div>
        </div>

        <!-- Callout 2: Bottom-Left -->
        <div class="callout-item callout-2">
          <div class="callout-label">Organic Maple &amp; Coconut</div>
          <div class="callout-tile">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22c4.97 0 9-4.03 9-9 0-4.97-4.03-11-9-11S3 8.03 3 13c0 4.97 4.03 9 9 9z"></path>
            </svg>
          </div>
        </div>

        <!-- Callout 3: Bottom-Right -->
        <div class="callout-item callout-3">
          <div class="callout-tile">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
          </div>
          <div class="callout-label">Light, Aerated Snap</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Loading HUD -->
  <div id="loading-hud">
    <svg width="18" height="18" viewBox="0 0 24 24" stroke="#fff" stroke-width="2.5" fill="none">
      <circle cx="12" cy="12" r="10" stroke-opacity="0.25"/>
      <path d="M12 2a10 10 0 0 1 10 10"/>
    </svg>
    <span id="loading-text">正在載入 3D 月球...</span>
  </div>

  <script>
    function clamp(v, min = 0, max = 1) { return Math.max(min, Math.min(max, v)); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
    function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

    // Split secondary title into animated characters
    const diffTitleEl = document.getElementById('diff-title');
    const diffText = diffTitleEl.textContent.trim();
    diffTitleEl.innerHTML = '';
    const diffLetters = [];
    for (let i = 0; i < diffText.length; i++) {
      const span = document.createElement('span');
      span.className = 'diff-char';
      span.textContent = diffText[i];
      diffTitleEl.appendChild(span);
      diffLetters.push(span);
      span.style.opacity = '0';
    }

    const charSan = document.getElementById('char-san');
    const charFen = document.getElementById('char-fen');
    const bgImg = document.getElementById('bg-img');

    let targetScroll = 0;
    let smoothScroll = 0;

    function onScroll() {
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      targetScroll = maxScroll > 0 ? clamp(window.scrollY / maxScroll, 0, 1) : 0;
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();

    let mouseX = 0, mouseY = 0, smoothMouseX = 0, smoothMouseY = 0;
    window.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
      mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    let lastTime = performance.now();

    function tickText(now) {
      const dt = clamp(now - lastTime, 0, 64);
      lastTime = now;

      const factor = 1 - Math.exp(-dt / 160);
      smoothScroll += (targetScroll - smoothScroll) * factor;
      if (Math.abs(targetScroll - smoothScroll) < 0.0005) smoothScroll = targetScroll;

      smoothMouseX += (mouseX - smoothMouseX) * 0.08;
      smoothMouseY += (mouseY - smoothMouseY) * 0.08;

      // 1. Background Parallax: smooth pan all the way down to reveal the sea
      const naturalRatio = (bgImg.naturalHeight && bgImg.naturalWidth)
        ? (bgImg.naturalHeight / bgImg.naturalWidth)
        : (1024 / 576);
      const imgWidth = bgImg.getBoundingClientRect().width || window.innerWidth * 1.05;
      const trueRenderedHeight = Math.max(imgWidth * naturalRatio, window.innerHeight * 1.4);
      const maxShift = Math.max(0, trueRenderedHeight - window.innerHeight);
      const bgY = -maxShift * smoothScroll + smoothMouseY * 12;
      const bgX = smoothMouseX * -15;
      bgImg.style.transform = `translate3d(calc(-50% + ${bgX}px), ${bgY}px, 0)`;

      // 2. Super Big Title "三 分" Animation: Flanking the moon and expanding apart on scroll
      const heroDisperseP = easeInOutCubic(clamp(smoothScroll / 0.45));
      const heroOpacity = 1 - clamp((heroDisperseP - 0.15) / 0.85);

      // "三" moves left & tilts slightly
      charSan.style.transform = `translate3d(${-heroDisperseP * 240 + smoothMouseX * -20}px, ${-heroDisperseP * 60 + smoothMouseY * 10}px, 0) scale(${1 + heroDisperseP * 0.15})`;
      charSan.style.opacity = heroOpacity;

      // "分" moves right & tilts slightly
      charFen.style.transform = `translate3d(${heroDisperseP * 240 + smoothMouseX * 20}px, ${-heroDisperseP * 60 + smoothMouseY * 10}px, 0) scale(${1 + heroDisperseP * 0.15})`;
      charFen.style.opacity = heroOpacity;

      // 3. Secondary Big Title "你的解籤日記" Animation: Rising from bottom to completely flush at bottom
      const diffEnterP = easeOutCubic(clamp((smoothScroll - 0.38) / 0.58));
      diffLetters.forEach((span, i) => {
        const yOffset = (1 - diffEnterP) * 100;
        const charOpacity = clamp((diffEnterP - i * 0.03) / 0.85);
        span.style.transform = `translate3d(0, ${yOffset}px, 0)`;
        span.style.opacity = charOpacity;
      });

      // 4. Callout cards animation around the moon
      const callouts = document.querySelectorAll('.callout-item');
      callouts.forEach((item, i) => {
        const p = easeOutCubic(clamp((smoothScroll - 0.45 - i * 0.04) / 0.45));
        item.style.opacity = p;
        item.style.transform = `translate3d(0, ${(1 - p) * 35}px, 0)`;
      });

      requestAnimationFrame(tickText);
    }

    requestAnimationFrame(tickText);

    // Expose smoothed scroll and mouse coordinates to Three.js script
    window.__scene = {
      get scroll() { return smoothScroll; },
      get mouseX() { return smoothMouseX; },
      get mouseY() { return smoothMouseY; }
    };
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    function clamp(v, min = 0, max = 1) { return Math.max(min, Math.min(max, v)); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

    const canvas = document.getElementById('moon-canvas');
    const loadingHud = document.getElementById('loading-hud');
    const loadingText = document.getElementById('loading-text');

    const scene = new THREE.Scene();
    let w = window.innerWidth, h = window.innerHeight;
    const camera = new THREE.OrthographicCamera(-w / 2, w / 2, h / 2, -h / 2, 0.1, 5000);
    camera.position.z = 2000;

    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(w, h, false);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.setClearColor(0x000000, 0);

    function resize() {
      w = window.innerWidth;
      h = window.innerHeight;
      camera.left = -w / 2;
      camera.right = w / 2;
      camera.top = h / 2;
      camera.bottom = -h / 2;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
    }
    window.addEventListener('resize', resize);

    // Dynamic Lighting
    scene.add(new THREE.HemisphereLight(0xcde0ff, 0x221820, 0.9));
    const keyLight = new THREE.DirectionalLight(0xf5f8ff, 1.4);
    keyLight.position.set(-600, 800, 1400);
    scene.add(keyLight);
    const rimLight = new THREE.DirectionalLight(0xffbe88, 0.7);
    rimLight.position.set(700, -200, 600);
    scene.add(rimLight);

    const moonGroup = new THREE.Group();
    const innerGroup = new THREE.Group();
    moonGroup.add(innerGroup);
    scene.add(moonGroup);

    let ready = false;
    let loadStartTime = performance.now();

    function applyGltfModel(gltf) {
      const model = gltf.scene || gltf.scenes[0];
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);

      model.position.sub(center);
      if (maxDim > 0) {
        model.scale.multiplyScalar(1 / maxDim);
      }

      model.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = false;
          child.receiveShadow = false;
          if (child.material) {
            child.material.toneMapped = true;
            child.material.depthWrite = true;
          }
        }
      });

      innerGroup.add(model);
      ready = true;
      loadStartTime = performance.now();

      if (loadingHud) {
        loadingHud.style.opacity = '0';
        setTimeout(() => { loadingHud.remove(); }, 600);
      }
    }

    const loader = new GLTFLoader();
    loader.load(
      'Hi3D-moon.glb',
      applyGltfModel,
      function (xhr) {
        if (xhr.lengthComputable && loadingText) {
          const pct = Math.round((xhr.loaded / xhr.total) * 100);
          loadingText.textContent = `正在載入 3D 月球 (${pct}%)...`;
        }
      },
      function (err) {
        console.warn('Local file load fallback to CDN...', err);
        loader.load(
          'https://cdn.jsdelivr.net/gh/jnyang6270-art/moon@main/Hi3D-moon.glb',
          applyGltfModel
        );
      }
    );

    function tick(now) {
      const smoothScroll = window.__scene ? window.__scene.scroll : 0;
      const mx = window.__scene ? window.__scene.mouseX : 0;
      const my = window.__scene ? window.__scene.mouseY : 0;

      const transition = easeInOutCubic(smoothScroll);
      const introP = ready ? clamp((now - loadStartTime) / 1200) : 0;

      // 1. Initial State (Scroll = 0): Moon sits right in the dead center between "三" and "分"
      const heroDiameter = Math.min(w * 0.42, h * 0.58, 480);
      const heroX = 0;
      const heroY = 0;

      // 2. Final State (Scroll = 1): Moon floats gracefully centered above the bottom title and between the 4 callouts
      const sectionDiameter = Math.min(w * 0.38, h * 0.46, 420);
      const sectionX = 0;
      const sectionY = h * 0.08; // slightly elevated above center

      // Current interpolation
      const curDiameter = lerp(heroDiameter, sectionDiameter, transition);
      const curX = lerp(heroX, sectionX, transition) + mx * 16;
      const curY = lerp(heroY, sectionY, transition) + Math.sin(now * 0.0014) * 8 + my * 12;

      moonGroup.position.set(curX, curY, 0);
      moonGroup.scale.set(curDiameter, curDiameter, curDiameter);

      // Continuous ambient rotation and mouse reactive tilt
      moonGroup.rotation.y = now * 0.00025 + mx * 0.35;
      moonGroup.rotation.x = Math.sin(now * 0.001) * 0.06 + my * -0.25;

      const opacity = ready ? clamp(introP * 1.5) : 0;
      innerGroup.traverse((child) => {
        if (child.isMesh && child.material) {
          const mats = Array.isArray(child.material) ? child.material : [child.material];
          mats.forEach((mat) => {
            mat.transparent = opacity < 1;
            mat.opacity = opacity;
          });
        }
      });

      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  </script>
</body>
</html>
