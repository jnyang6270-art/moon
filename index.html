<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Model Preview - Hi3D Moon</title>
  <!-- Google Model Viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1rem 1.5rem;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
    }
    .badge {
      font-size: 0.75rem;
      background: #3b82f6;
      color: white;
      padding: 0.25rem 0.5rem;
      border-radius: 9999px;
      margin-left: 0.5rem;
    }
    .model-container {
      flex: 1;
      width: 100%;
      height: calc(100vh - 65px);
      position: relative;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
      background-color: #0b0f19;
    }
    .controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 0.85rem;
      color: #94a3b8;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn {
      background: #2563eb;
      color: white;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      transition: background 0.2s;
      border: none;
      cursor: pointer;
    }
    .btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <span style="font-weight: bold;">Hi3D Moon</span>
      <span class="badge">GLB 3D Model</span>
    </div>
    <a href="Hi3D-moon.glb" download class="btn">下載模型 (.glb)</a>
  </header>

  <div class="model-container">
    <model-viewer
      src="Hi3D-moon.glb"
      alt="Hi3D Moon 3D model"
      auto-rotate
      camera-controls
      touch-action="pan-y"
      shadow-intensity="1"
      exposure="1"
      ar>
    </model-viewer>

    <div class="controls">
      <span>🖱️ 拖曳旋轉 / 滾輪縮放</span>
    </div>
  </div>
</body>
</html>
